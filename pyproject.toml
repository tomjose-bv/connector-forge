[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "connector-forge"
version = "0.0.1"
description = "Local AI agent that turns API docs into tested data connectors, plus an evaluation harness."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = ["duckdb>=1.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
connector-forge = "connector_forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
